<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fawry Employee Manager</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#152033;--muted:#6b7280;--line:#e7eaf0;--primary:#6b3fd6;--primary2:#8b5cf6;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--shadow:0 10px 30px #1f293710}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.app{min-height:100vh}.top{background:linear-gradient(135deg,#4b22b8,#7c4ce0);color:#fff;padding:24px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand h1{margin:0 0 6px;font-size:25px}.brand p{margin:0;opacity:.85}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700}.btn.primary{background:#fff;color:#5b2bbd}.btn.dark{background:#ffffff20;color:#fff;border:1px solid #ffffff40}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.wrap{max-width:1400px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat .n{font-size:28px;font-weight:800;margin-top:7px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.card{padding:18px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.list{max-height:620px;overflow:auto}.emp{padding:12px;border-radius:12px;cursor:pointer;margin-bottom:7px;border:1px solid transparent}.emp:hover,.emp.active{background:#f1ecff;border-color:#d9cbff}.emp small{display:block;color:var(--muted);margin-top:4px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h2{margin:0;font-size:19px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:72px;resize:vertical}.wide{grid-column:1/-1}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}.tab.active{background:#eee7ff;border-color:#cfc0ff;color:#5525b8;font-weight:700}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:center}.tbl th{background:#fafafa;font-size:12px}.good{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.bar{height:10px;background:#eee;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}.canvas{width:100%;height:250px;border:1px solid var(--line);border-radius:14px;background:#fff}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:8px}.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:18px;left:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:9}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.fields{grid-template-columns:1fr}.top{padding:20px}.wrap{padding:0 10px}.top-actions{width:100%}.top-actions .btn{flex:1}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><h1>مرحبًا بك يا زياد 👋</h1><p>Fawry Employee Manager — إدارة الموظفين والأداء والمتابعة</p></div><div class="top-actions"><button class="btn primary" onclick="openEmployee()">＋ إضافة موظف</button><button class="btn dark" onclick="exportData()">تصدير البيانات</button><button class="btn dark" onclick="document.getElementById('importFile').click()">استيراد</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></header>
<main class="wrap"><section class="grid" id="stats"></section>
<div class="layout"><aside class="card"><div class="section-title"><h2>الموظفون</h2><span class="muted" id="empCount"></span></div><input class="search" id="search" placeholder="ابحث باسم الموظف أو الكود..." oninput="renderList()"><div class="list" id="empList"></div></aside>
<section class="card"><div id="content"></div></section></div></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const blankMonthly=()=>months.map(m=>({month:m,cards:0,fawry:0,attendance:0,late:0,requests:[]}));
let data=JSON.parse(localStorage.getItem('fawryEmployees')||'null');
if(!data){data=[];for(let i=1;i<=115;i++)data.push({id:crypto.randomUUID(),name:'Employee '+i,code:'',hire:'',email:'',receiptLimit:0,posLimit:0,location:'',notes:'',monthly:blankMonthly()});save()}
let selected=data[0]?.id||null;
function save(){localStorage.setItem('fawryEmployees',JSON.stringify(data))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){renderStats();renderList();renderContent()}
function renderStats(){let cards=data.reduce((a,e)=>a+e.monthly.reduce((x,m)=>x+Number(m.cards||0),0),0),fawry=data.reduce((a,e)=>a+e.monthly.reduce((x,m)=>x+Number(m.fawry||0),0),0),pending=data.reduce((a,e)=>a+e.monthly.reduce((x,m)=>x+m.requests.filter(r=>r.status!=='تم').length,0),0);document.getElementById('stats').innerHTML=`<div class="stat"><div class="muted">إجمالي الموظفين</div><div class="n">${data.length}</div></div><div class="stat"><div class="muted">إجمالي الكروت</div><div class="n">${cards.toLocaleString()}</div></div><div class="stat"><div class="muted">إجمالي Fawry Yawmy</div><div class="n">${fawry.toLocaleString()}</div></div><div class="stat"><div class="muted">طلبات تحتاج متابعة</div><div class="n">${pending}</div></div>`}
function renderList(){let q=(document.getElementById('search').value||'').toLowerCase();let a=data.filter(e=>(e.name+' '+e.code).toLowerCase().includes(q));document.getElementById('empCount').textContent=data.length;document.getElementById('empList').innerHTML=a.map(e=>`<div class="emp ${e.id===selected?'active':''}" onclick="selectEmp('${e.id}')"><b>${esc(e.name)}</b><small>${esc(e.code||'بدون كود')} ${e.location?'• '+esc(e.location):''}</small></div>`).join('')||'<div class="empty">لا يوجد موظفون</div>'}
function selectEmp(id){selected=id;renderList();renderContent()}
function current(){return data.find(e=>e.id===selected)}
function renderContent(){let e=current();if(!e){document.getElementById('content').innerHTML='<div class="empty">اختر موظفًا</div>';return}let tabs=['الملف','الأداء الشهري','الحضور والانصراف','الطلبات والتذكيرات'];let active=window.activeTab||'الملف';document.getElementById('content').innerHTML=`<div class="section-title"><div><h2>${esc(e.name)}</h2><div class="muted">${esc(e.code||'بدون كود')} — ${esc(e.location||'المكان غير محدد')}</div></div><div><button class="btn" onclick="openEmployee('${e.id}')">تعديل</button> <button class="btn red" onclick="deleteEmployee('${e.id}')">حذف</button></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${active===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div><div id="tabBody"></div>`;renderTab(e,active)}
function setTab(t){window.activeTab=t;renderContent()}
function renderTab(e,t){let b=document.getElementById('tabBody');if(t==='الملف')b.innerHTML=`<div class="fields"><div class="field"><label>تاريخ التعيين</label><div>${esc(e.hire||'—')}</div></div><div class="field"><label>الإيميل</label><div>${esc(e.email||'—')}</div></div><div class="field"><label>Limit الإيصالات</label><div>${Number(e.receiptLimit||0).toLocaleString()}</div></div><div class="field"><label>Limit POS</label><div>${Number(e.posLimit||0).toLocaleString()}</div></div><div class="field"><label>مكان الموظف</label><div>${esc(e.location||'—')}</div></div><div class="field wide"><label>ملاحظات</label><div>${esc(e.notes||'—')}</div></div></div>`;else if(t==='الأداء الشهري')renderPerformance(e,b);else if(t==='الحضور والانصراف')renderAttendance(e,b);else renderRequests(e,b)}
function renderPerformance(e,b){let rows=e.monthly.map((m,i)=>{let ca=Number(m.cards||0),fa=Number(m.fawry||0),cg=i?((ca-Number(e.monthly[i-1].cards||0))/(Number(e.monthly[i-1].cards||0)||1)):0,fg=i?((fa-Number(e.monthly[i-1].fawry||0))/(Number(e.monthly[i-1].fawry||0)||1)):0;return `<tr><td>${m.month}</td><td>${ca}</td><td>200</td><td>${(ca/200*100).toFixed(1)}%</td><td>${fa}</td><td>200</td><td>${(fa/200*100).toFixed(1)}%</td><td class="${cg>=0?'good':'bad'}">${(cg*100).toFixed(1)}%</td><td class="${fg>=0?'good':'bad'}">${(fg*100).toFixed(1)}%</td></tr>`}).join('');b.innerHTML=`<div class="table-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th>Cards</th><th>Target</th><th>Ach.</th><th>Fawry Yawmy</th><th>Target</th><th>Ach.</th><th>نمو Cards</th><th>نمو Fawry</th></tr></thead><tbody>${rows}</tbody></table></div><div style="height:15px"></div><canvas id="chart" class="canvas" width="1000" height="250"></canvas>`;drawChart(e)}
function drawChart(e){let c=document.getElementById('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);let max=Math.max(200,...e.monthly.flatMap(m=>[Number(m.cards||0),Number(m.fawry||0)]));x.font='12px Tahoma';x.strokeStyle='#e5e7eb';for(let i=0;i<5;i++){let y=20+i*(h-50)/4;x.beginPath();x.moveTo(45,y);x.lineTo(w-20,y);x.stroke()}let bw=(w-80)/12; e.monthly.forEach((m,i)=>{let xx=55+i*bw;let a=Number(m.cards||0),f=Number(m.fawry||0);x.fillStyle='#6b3fd6';x.fillRect(xx,h-30-(a/max)*(h-65),bw*.28,(a/max)*(h-65));x.fillStyle='#16a34a';x.fillRect(xx+bw*.34,h-30-(f/max)*(h-65),bw*.28,(f/max)*(h-65));x.fillStyle='#374151';x.fillText(m.month.slice(0,3),xx,h-10)});x.fillStyle='#6b3fd6';x.fillRect(w-150,15,12,12);x.fillStyle='#374151';x.fillText('Cards',w-132,26);x.fillStyle='#16a34a';x.fillRect(w-85,15,12,12);x.fillStyle='#374151';x.fillText('Fawry',w-67,26)}
function renderAttendance(e,b){let rows=e.monthly.map((m,i)=>`<tr><td>${m.month}</td><td><input value="${m.attendance||0}" onchange="setMonthly('${e.id}',${i},'attendance',this.value)"></td><td><input value="${m.late||0}" onchange="setMonthly('${e.id}',${i},'late',this.value)"></td></tr>`).join('');b.innerHTML=`<p class="muted">سجل الحضور والانصراف يمكن تطويره لاحقًا ليشمل وقت الدخول والخروج لكل يوم.</p><div class="table-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th>أيام الحضور</th><th>مرات التأخير</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function setMonthly(id,i,k,v){let e=data.find(x=>x.id===id);e.monthly[i][k]=Number(v)||0;save();renderStats()}
function renderRequests(e,b){let all=e.monthly.flatMap((m,mi)=>m.requests.map((r,ri)=>({...r,mi,ri,month:m.month})));b.innerHTML=`<button class="btn green" onclick="addRequest('${e.id}')">＋ إضافة طلب / تذكير</button><div style="height:14px"></div>${all.map(r=>`<div class="notice"><b>${esc(r.title)}</b> — ${esc(r.month)}<br><span class="muted">موعد المتابعة: ${esc(r.date||'غير محدد')} • الحالة: ${esc(r.status||'جديد')}</span><br><small>${esc(r.note||'')}</small><br><button class="btn" onclick="completeRequest('${e.id}',${r.mi},${r.ri})">تم</button></div>`).join('')||'<div class="empty">لا توجد طلبات أو تذكيرات</div>'}`}
function addRequest(id){let e=data.find(x=>x.id===id);document.getElementById('modalbox').innerHTML=`<h2>إضافة طلب / تذكير</h2><div class="fields"><div class="field wide"><label>الطلب</label><input id="rTitle" placeholder="مثال: طلب POS جديد"></div><div class="field"><label>تاريخ المتابعة</label><input id="rDate" type="date"></div><div class="field"><label>الشهر</label><select id="rMonth">${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div><div class="field wide"><label>ملاحظات</label><textarea id="rNote"></textarea></div></div><div style="margin-top:15px"><button class="btn green" onclick="saveRequest('${id}')">حفظ</button> <button class="btn" onclick="closeModal()">إلغاء</button></div>`;openModal()}
function saveRequest(id){let t=document.getElementById('rTitle').value.trim();if(!t)return toast('اكتب الطلب أولًا');let e=data.find(x=>x.id===id),mi=Number(document.getElementById('rMonth').value);e.monthly[mi].requests.push({title:t,date:document.getElementById('rDate').value,note:document.getElementById('rNote').value,status:'جديد'});save();closeModal();window.activeTab='الطلبات والتذكيرات';render()}
function completeRequest(id,mi,ri){data.find(x=>x.id===id).monthly[mi].requests[ri].status='تم';save();render()}
function openEmployee(id){let e=id?data.find(x=>x.id===id):null;document.getElementById('modalbox').innerHTML=`<h2>${e?'تعديل موظف':'إضافة موظف'}</h2><div class="fields"><div class="field"><label>اسم الموظف</label><input id="fName" value="${esc(e?.name||'')}"></div><div class="field"><label>الكود الوظيفي</label><input id="fCode" value="${esc(e?.code||'')}"></div><div class="field"><label>تاريخ التعيين</label><input id="fHire" type="date" value="${esc(e?.hire||'')}"></div><div class="field"><label>الإيميل</label><input id="fEmail" type="email" value="${esc(e?.email||'')}"></div><div class="field"><label>Limit الإيصالات</label><input id="fReceipt" type="number" value="${e?.receiptLimit||0}"></div><div class="field"><label>Limit POS</label><input id="fPos" type="number" value="${e?.posLimit||0}"></div><div class="field"><label>مكان الموظف</label><input id="fLocation" value="${esc(e?.location||'')}"></div><div class="field wide"><label>ملاحظات أخرى</label><textarea id="fNotes">${esc(e?.notes||'')}</textarea></div></div><div style="margin-top:15px"><button class="btn green" onclick="saveEmployee('${id||''}')">حفظ</button> <button class="btn" onclick="closeModal()">إلغاء</button></div>`;openModal()}
function saveEmployee(id){let obj={name:document.getElementById('fName').value.trim(),code:document.getElementById('fCode').value.trim(),hire:document.getElementById('fHire').value,email:document.getElementById('fEmail').value.trim(),receiptLimit:Number(document.getElementById('fReceipt').value)||0,posLimit:Number(document.getElementById('fPos').value)||0,location:document.getElementById('fLocation').value.trim(),notes:document.getElementById('fNotes').value};if(!obj.name)return toast('اسم الموظف مطلوب');if(id){let e=data.find(x=>x.id===id);Object.assign(e,obj)}else{obj.id=crypto.randomUUID();obj.monthly=blankMonthly();data.push(obj);selected=obj.id}save();closeModal();render();toast('تم حفظ بيانات الموظف')}
function deleteEmployee(id){if(!confirm('هل تريد حذف الموظف؟'))return;data=data.filter(e=>e.id!==id);selected=data[0]?.id||null;save();render()}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fawry_employee_backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);selected=data[0]?.id||null;save();render();toast('تم استيراد البيانات')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
render();
</script></body></html>
